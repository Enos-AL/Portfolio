<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#02070D" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-M7P883H3LE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Consent Mode v2 (LGPD): nega o armazenamento de cookies até o usuário aceitar.
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied'
      });

      // Se o visitante já aceitou em uma visita anterior, libera a análise.
      try {
        if (localStorage.getItem('cookie-consent') === 'accepted') {
          gtag('consent', 'update', { analytics_storage: 'granted' });
        }
      } catch (e) {}

      gtag('js', new Date());
      gtag('config', 'G-M7P883H3LE');
    </script>

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <title>ED² Tecnologic | Sistemas, Sites e Soluções Digitais</title>

    />
